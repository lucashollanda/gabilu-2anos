<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gabilu 2 Anos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Sans:wght@400;500&family=Young+Serif&display=swap">
<style>
  /* Layout: uma tela de envelope que abre numa carta de coluna única, com contador de tempo juntos no fim. */
  :root {
    --bg: #FDE8EC;
    --paper: #FFF7F8;
    --ink: #4B1230;
    --muted: #8A5368;
    --accent: #E23B55;
    --accent-2: #9B7FE0;
    --line: #F2C4CF;
    --env-back: #E995AA;
    --env-front: #F6B5C3;
    --env-flap: #F9C6D1;
    --font-display: "Young Serif", Georgia, "Times New Roman", serif;
    --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-hand: "Caveat", "Bradley Hand", "Segoe Script", cursive;
    --polaroid: #FFFDFB;
    --polaroid-ink: #4B1230;
    --pin: #C98F5A;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1F1020; --paper: #2C1730; --ink: #FCE6EC; --muted: #C9A0B3;
      --accent: #FF6F88; --accent-2: #B79CF2; --line: #4A2A4C;
      --env-back: #53213F; --env-front: #6B2E54; --env-flap: #7A3862;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1F1020; --paper: #2C1730; --ink: #FCE6EC; --muted: #C9A0B3;
    --accent: #FF6F88; --accent-2: #B79CF2; --line: #4A2A4C;
    --env-back: #53213F; --env-front: #6B2E54; --env-flap: #7A3862;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 1.0625rem;
    line-height: 1.7;
    padding-block: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    min-height: 100dvh;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent-2); outline-offset: 4px; }

  /* ---------- Envelope ---------- */
  #gate {
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2rem; padding-block: 2rem;
    transition: opacity .6s ease, transform .6s ease;
  }
  #gate.leaving { opacity: 0; transform: translateY(-12px); pointer-events: none; }
  .gate-label {
    font-family: var(--font-hand); font-size: 1.9rem; color: var(--muted); margin: 0; text-align: center;
  }
  .env {
    position: relative; width: min(340px, 82vw); aspect-ratio: 4 / 3;
    background: none; border: 0; padding: 0; cursor: pointer;
    filter: drop-shadow(0 14px 22px rgba(75, 18, 48, .18));
    -webkit-tap-highlight-color: transparent;
  }
  .env > * { position: absolute; inset: 0; }
  .env-back { background: var(--env-back); border-radius: 6px; }
  .env-letter {
    inset: 9% 8% 9% 8%; background: var(--paper); border-radius: 4px; z-index: 2;
    background-image: repeating-linear-gradient(transparent 0 22px, var(--line) 22px 23px);
    background-position: 0 28px;
    transition: transform .8s cubic-bezier(.3, .8, .3, 1) .35s;
  }
  .env-front {
    background: var(--env-front); z-index: 4; border-radius: 6px;
    clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
  }
  .env-flap {
    background: var(--env-flap); z-index: 5; bottom: auto; height: 56%;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform .7s ease, z-index 0s linear .3s;
  }
  .env-seal {
    inset: auto; left: 50%; top: 56%; z-index: 6; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: var(--accent); display: grid; place-items: center;
    box-shadow: 0 3px 8px rgba(0, 0, 0, .25);
    transition: opacity .3s ease, transform .3s ease;
    animation: beat 1.8s ease-in-out infinite;
  }
  .env-seal svg { width: 24px; height: 24px; fill: #fff; }
  .env.open .env-flap { transform: rotateX(180deg); z-index: 1; }
  .env.open .env-letter { transform: translateY(-46%); }
  .env.open .env-seal { opacity: 0; transform: scale(.4); animation: none; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }

  /* ---------- Carta ---------- */
  #letter { display: none; padding-block: 3.5rem 4rem; }
  #letter.shown { display: block; }
  .wrap { max-width: 36rem; margin-inline: auto; }
  .eyebrow {
    font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 1rem;
  }
  h1 {
    font-family: var(--font-display); font-weight: 400; font-size: clamp(2.4rem, 9vw, 3.6rem);
    line-height: 1.08; margin: 0 0 2rem; text-wrap: balance;
  }
  h1 em { font-style: normal; color: var(--accent); }
  .text p { margin: 0 0 1.2rem; max-width: 34rem; }
  .text p.mark { color: var(--accent); font-weight: 500; }
  .sign {
    font-family: var(--font-hand); font-size: 2.2rem; line-height: 1.2; margin: 2rem 0 0; color: var(--accent);
  }
  .reveal { animation: rise .8s ease both; animation-delay: calc(var(--i, 0) * .3s); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* ---------- Polaroides no varal ---------- */
  .photos {
    position: relative; margin: 0 0 2.25rem; padding: 30px 4% 0;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 4%;
  }
  .string { position: absolute; left: 0; top: 0; width: 100%; height: 60px; overflow: visible; }
  .string path { fill: none; stroke: var(--muted); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .polaroid {
    position: relative; margin: 0; width: 100%; max-width: 260px; justify-self: center;
    background: var(--polaroid); padding: 10px 10px 0;
    box-shadow: 0 8px 18px rgba(75, 18, 48, .22), 0 1px 3px rgba(75, 18, 48, .25);
    transform-origin: 50% 0;
    transform: rotate(var(--r, 0deg));
    animation: sway 5s ease-in-out var(--delay, 0s) infinite alternate;
  }
  .polaroid::before {
    content: ""; position: absolute; top: -12px; left: 50%; width: 12px; height: 28px; margin-left: -6px;
    background: var(--pin); border-radius: 3px; z-index: 2;
    box-shadow: 0 2px 3px rgba(0, 0, 0, .3), inset 0 -8px 0 rgba(0, 0, 0, .12);
  }
  .shot { aspect-ratio: 4 / 5; overflow: hidden; background: #2a1a2a; }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; }
  .polaroid figcaption {
    font-family: var(--font-hand); font-size: 1.55rem; line-height: 1.1; color: var(--polaroid-ink);
    text-align: center; padding: .7rem .25rem .8rem;
  }
  @keyframes sway {
    from { transform: rotate(calc(var(--r, 0deg) - 1.6deg)); }
    to { transform: rotate(calc(var(--r, 0deg) + 1.6deg)); }
  }

  /* ---------- Contador ---------- */
  .counter { margin-top: 3.5rem; padding-top: 2rem; border-top: 1px solid var(--line); }
  .counter h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; margin: 0 0 .25rem; }
  .counter .since { color: var(--muted); margin: 0 0 1.25rem; font-size: .95rem; }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem; }
  @media (min-width: 560px) { .tiles { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  .tile {
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: .8rem .4rem .6rem;
    text-align: left; padding-left: .8rem;
  }
  .tile b {
    display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.8rem; line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .tile span { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .next { margin: 1.25rem 0 0; color: var(--muted); font-size: .95rem; }
  .next strong { color: var(--accent); font-weight: 500; }

  .tiles.cd { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .bar { margin-top: 1.1rem; }
  .bar .track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar .track i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; }
  .bar .labels { display: flex; justify-content: space-between; gap: 1rem; margin-top: .4rem; font-size: .75rem; letter-spacing: .06em; color: var(--muted); }
  [hidden] { display: none !important; }

  /* ---------- Corações ---------- */
  #hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .heart {
    position: absolute; bottom: -2rem; color: var(--accent); opacity: 0;
    animation: float var(--d, 7s) linear forwards;
  }
  @keyframes float {
    0% { transform: translate(0, 0) scale(.7); opacity: 0; }
    10% { opacity: .8; }
    100% { transform: translate(var(--x, 20px), -110vh) scale(1.1); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .env-seal { animation: none; }
    .reveal, .polaroid { animation: none; }
    #gate, .env-letter, .env-flap { transition: none; }
  }
</style>

</head>
<body>
<div id="hearts" aria-hidden="true"></div>

<main>
  <section id="gate" aria-label="Envelope">
    <p class="gate-label">Uma carta para você, Gabilu</p>
    <button class="env" id="env" aria-label="Abrir a carta">
      <span class="env-back"></span>
      <span class="env-letter"></span>
      <span class="env-front"></span>

      <span class="env-seal">

      </span>

      <div class="text" id="text"></div>
      <p class="sign reveal" id="sign" style="--i:10">Do seu Lucas</p>

      <section class="counter reveal" style="--i:11" aria-label="Tempo juntos">
        <h2 id="counterTitle">Nosso tempo juntos</h2>
        <p class="since" id="since">Desde 24 de outubro de 2024</p>
        <div class="tiles" id="tiles">
          <div class="tile"><b id="t-y">0</b><span>anos</span></div>
          <div class="tile"><b id="t-m">0</b><span>meses</span></div>
          <div class="tile"><b id="t-d">0</b><span>dias</span></div>
          <div class="tile"><b id="t-h">0</b><span>horas</span></div>
          <div class="tile"><b id="t-i">0</b><span>min</span></div>
          <div class="tile"><b id="t-s">0</b><span>seg</span></div>
        </div>
        <div class="bar" id="bar" hidden>
          <div class="track" aria-hidden="true"><i id="barFill"></i></div>
          <div class="labels"><span>começou em 19/10, às 10h</span><span>24/10</span></div>
        </div>
        <p class="next" id="next"></p>
      </section>

</main>

<script>
  // ====== EDITE AQUI ======
  var NOME = "Gabilu";
  var ASSINATURA = "Do seu Lucas";
  var INICIO = new Date(2024, 9, 24, 0, 0, 0);     // 24/10/2024
  var ANIVERSARIO = new Date(2026, 9, 24, 0, 0, 0); // 24/10/2026
  var INICIO_CONTAGEM = new Date(2026, 9, 19, 10, 0, 0); // a contagem regressiva começa em 19/10 às 10h
  var CARTA = [
    "Minha vida, passando pra te lembrar que estamos prestes a completar dois anos.",
    "Sem dúvida, o ano mais desafiador da gente. Aprendemos, erramos e levantamos. Muitas vezes achei que ia te perder, perder o nosso relacionamento, mas Deus nos fortalece e mostra que isso é pra gente. Tenho muito orgulho da gente. Eu te amo muito.",
    "Que possamos viver inúmeros anos, meses, dias e segundos juntos. Que possamos comer inúmeros macarrões, docinhos e pizzas da Forneria.",
    "Sua companhia, sua braveza, seu jeito meigo e humilde me encantam. Não consigo me imaginar sem isso, sem você.",
    "Obrigado por confiar, por se sentir segura e saber que pode contar comigo pra tudo. Nunca vou soltar a sua mão. Obrigado por me desafiar sempre, por nunca ter desistido da gente, por me respeitar, me apoiar e me amar.",
    "*Que nunca nos falte amor, e que você nunca deixe de demonstrar o seu amor por mim, principalmente do seu jeito, que é o que mais importa. Que sejamos felizes.",
    "Ótima segunda. Te amo. Até breve."
  ];
  // Linhas que começam com * aparecem em destaque.
  // ========================

  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  $("sign").textContent = ASSINATURA;
  var box = $("text");
  CARTA.forEach(function (line, i) {
    var p = document.createElement("p");
    p.className = "reveal";
    p.style.setProperty("--i", String(i + 3));
    if (line.charAt(0) === "*") { p.className += " mark"; line = line.slice(1); }
    p.textContent = line;
    box.appendChild(p);
  });

  function diff(a, b) {
    var y = b.getFullYear() - a.getFullYear();
    var m = b.getMonth() - a.getMonth();
    var d = b.getDate() - a.getDate();
    var h = b.getHours() - a.getHours();
    var i = b.getMinutes() - a.getMinutes();
    var s = b.getSeconds() - a.getSeconds();
    if (s < 0) { s += 60; i--; }
    if (i < 0) { i += 60; h--; }
    if (h < 0) { h += 24; d--; }
    if (d < 0) { m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
    if (m < 0) { m += 12; y--; }
    return { y: y, m: m, d: d, h: h, i: i, s: s };
  }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  function tick() {
    var now = new Date();
    var dayMs = 86400000;
    var cd = now < ANIVERSARIO;
    var t;
    if (cd) {
      var ms = ANIVERSARIO - now;
      t = { y: 0, m: 0, d: Math.floor(ms / dayMs), h: Math.floor((ms % dayMs) / 3600000),
            i: Math.floor((ms % 3600000) / 60000), s: Math.floor((ms % 60000) / 1000) };
    } else {
      t = diff(INICIO, now);
    }
    $("t-y").textContent = t.y; $("t-m").textContent = t.m; $("t-d").textContent = t.d;
    $("t-h").textContent = t.h; $("t-i").textContent = t.i; $("t-s").textContent = t.s;
    $("t-y").parentNode.hidden = cd; $("t-m").parentNode.hidden = cd;
    $("tiles").className = cd ? "tiles cd" : "tiles";
    $("bar").hidden = !cd;
    var title = $("counterTitle"), next = $("next"), since = $("since");
    if (cd) {
      var pct = Math.max(0, Math.min(1, (now - INICIO_CONTAGEM) / (ANIVERSARIO - INICIO_CONTAGEM)));
      $("barFill").style.width = (pct * 100).toFixed(2) + "%";
      title.textContent = "Faltam para os nossos 2 anos";
      since.textContent = "Contagem até 24 de outubro de 2026, à meia-noite";
      next.textContent = "";
    } else if (now - ANIVERSARIO < dayMs) {
      title.textContent = "Hoje a gente faz 2 anos";
      since.textContent = "Desde 24 de outubro de 2024";
      next.innerHTML = "<strong>Feliz aniversário de namoro, " + NOME + ".</strong>";
    } else {
      title.textContent = "Nosso tempo juntos";
      since.textContent = "Desde 24 de outubro de 2024";
      next.textContent = "";
    }
  }

  function spawnHeart() {
    var h = document.createElement("span");
    h.className = "heart";
    h.textContent = "♥︎";
    h.style.left = Math.random() * 100 + "%";
    h.style.fontSize = (14 + Math.random() * 22) + "px";
    h.style.setProperty("--d", (6 + Math.random() * 5) + "s");
    h.style.setProperty("--x", (Math.random() * 80 - 40) + "px");
    $("hearts").appendChild(h);
    setTimeout(function () { if (h.parentNode) h.parentNode.removeChild(h); }, 12000);
  }

  var opened = false;
  $("env").addEventListener("click", function () {
    if (opened) return;
    opened = true;
    $("env").classList.add("open");
    var wait = reduce ? 0 : 1500;
    setTimeout(function () {
      $("gate").classList.add("leaving");
      setTimeout(function () {
        $("gate").style.display = "none";
        $("letter").classList.add("shown");
        window.scrollTo(0, 0);
        tick();
        setInterval(tick, 1000);
        if (!reduce) {
          for (var k = 0; k < 6; k++) setTimeout(spawnHeart, k * 250);
          setInterval(function () { if ($("hearts").childElementCount < 14) spawnHeart(); }, 900);
        }
      }, reduce ? 0 : 600);
    }, wait);
  });
</script>
